<style>

html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;font:16px/1.6 'Be Vietnam Pro',system-ui,sans-serif;background:var(--bg);color:var(--ink)}

label,.lb{display:block;font-weight:600;font-size:15px;margin:14px 0 4px}

.mt{display:flex;gap:6px;max-width:260px}.mt i{flex:1;height:10px;border-radius:99px;background:var(--ln)}.mt i.f{background:var(--pri)}

.steps li{counter-increment:s;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut)}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--ln);font-weight:700}
.steps li.cur{color:var(--ink);font-weight:700}.steps li.cur::before{background:var(--pri);border-color:var(--pri);color:var(--on)}

.rt button{background:none;border:0;font-size:26px;color:var(--ln);cursor:pointer;padding:0 2px}.rt button.on{color:var(--y)}
.dec{display:grid;gap:12px}

.pb{padding:16px;display:grid;gap:12px}.pb ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}.pb li b{display:inline-block;min-width:80px}
.qr{width:84px;height:84px;fill:#0F1B3D;background:#fff;padding:6px;border-radius:8px;border:1px solid var(--ln)}
dt{font-weight:700;margin-top:10px}dd{margin:2px 0 0;color:var(--mut)}
.em{grid-column:1/-1;color:var(--mut)}
a.lk{color:var(--pri);font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}#toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

const a=S.filter(s=>(!q||(s.n+' '+s.t+' '+s.d+' '+s.r.join(' ')).toLowerCase().includes(q))&&(!st.loc||s.loc===st.loc)&&(!t||(s.h[0]<=t[1]&&s.h[1]>=t[0])));
return a.length?a.map(card).join(''):'<p class="em">Chưa có startup khớp bộ lọc. Hãy bỏ bớt một điều kiện để xem thêm.</p>'}
function home(){return `<section class="hero w"><div><h1>Thử việc 24 giờ, rồi mới quyết định.</h1><p class="lead">Hồ sơ startup được chuẩn hóa và có một đề bài nhỏ làm trong một ngày. Bạn hiểu đủ để chọn mà không cần nhắn hỏi lại nhiều.</p><div class="row l"><button class="btn" data-a="jump">Xem startup đang tuyển</button><a class="btn o" href="#profile">Tạo hồ sơ sinh viên</a></div></div><div class="card demo" aria-hidden="true"><div class="clock">24:00:00</div><div class="mx mini">${LN.map(l=>`<div class="ln ${l[0]}"><b>${l[1]}</b></div>`).join('')}</div><p class="mu">Mỗi hồ sơ startup có ma trận kỳ vọng 3 màu và một thử thách 24 giờ.</p></div></section>
<section class="w" id="ls"><div class="tb"><input id="q" type="search" placeholder="Tìm theo tên, lĩnh vực hoặc vị trí" value="${esc(st.q)}" aria-label="Tìm startup"><select id="fl" aria-label="Vị trí">${['','Hà Nội','TP.HCM','Online'].map(o=>`<option value="${o}" ${st.loc===o?'selected':''}>${o||'Mọi vị trí'}</option>`).join('')}</select><select id="ft" aria-label="Quỹ thời gian">${[['','Mọi quỹ thời gian'],['0-6','Tối đa 6 giờ/tuần'],['6-10','6–10 giờ/tuần'],['10-40','Trên 10 giờ/tuần']].map(o=>`<option value="${o[0]}" ${st.tm===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div><div class="g3" id="list">${lst()}</div></section>`}
function startup(){const s=cs(),f=fit(s);return `${steps(1)}<section class="w two"><div><div class="row l"><h2>${s.n}</h2>${bd(s)}</div><p class="mu">${s.t}, ${s.loc}</p><p class="lead">${s.d}</p><h3>Mục tiêu giai đoạn này</h3><p>${s.g}</p><h3>Quyền lợi</h3><p>${s.p}</p><h3>Vị trí cần</h3>${chips(s.r)}<h3>Mức công khai ý tưởng</h3><div class="mt" aria-hidden="true">${[1,2,3].map(n=>`<i class="${n<=s.i?'f':''}"></i>`).join('')}</div><p class="mu">${LV[s.i]}</p></div>
<aside class="card side"><h3>Quỹ thời gian</h3><p class="big">${s.h[0]}–${s.h[1]} giờ/tuần</p><p class="fit ${f[0]}">${f[1]}</p><a class="lk" href="#profile">Đổi quỹ thời gian của bạn</a><h3>Thử thách 24h</h3><p>${s.k}</p>${s.on?'<button class="btn w100" data-a="start">Nhận thử thách 24h</button>':'<button class="btn w100" disabled>Startup đang tạm dừng nhận bạn mới</button>'}</aside></section>
<section class="w"><h3>Ma trận kỳ vọng</h3><p class="mu">Xanh là điều startup cam kết, vàng là điều có thể trao đổi, đỏ là điều chưa thể đáp ứng.</p>${mx(s)}</section>`}
const skl=()=>st.sk.map((k,i)=>`<button class="chip" data-a="rmsk" data-i="${i}" aria-label="Xóa kỹ năng ${esc(k)}">${esc(k)} ×</button>`).join('');
function profile(){return `<section class="w two"><div class="card"><h2>Hồ sơ sinh viên</h2><label for="pn">Họ tên</label><input id="pn" value="Nguyễn Thu Hà"><label for="ps">Trường và năm học</label><input id="ps" value="Năm 3, Truyền thông đa phương tiện"><div class="lb">Kỹ năng</div><div class="chips" id="sk">${skl()}</div><div class="row l" style="margin-top:10px"><input id="ns" placeholder="Thêm kỹ năng" aria-label="Thêm kỹ năng"><button class="btn s" data-a="addsk">Thêm</button></div><label for="pf">Portfolio</label><textarea id="pf" rows="3">behance.net/thuha, bài viết fanpage CLB Truyền thông</textarea><label for="pg">Mục tiêu cá nhân</label><textarea id="pg" rows="2">Có 1 dự án thật cho portfolio trước khi tốt nghiệp.</textarea><label for="hrs">Quỹ thời gian mỗi tuần: <b id="hv">${st.hrs}</b> giờ</label><input type="range" id="hrs" min="2" max="20" value="${st.hrs}"><div class="lb">Kỳ vọng của mình</div><div class="chips">${EX.map((x,i)=>`<label class="ck"><input type="checkbox" ${i<3?'checked':''}> ${x}</label>`).join('')}</div><p><button class="btn" data-a="save">Lưu hồ sơ</button></p></div>
<aside class="card side"><h3>Hồ sơ này dùng để làm gì</h3><p>Startup xem kỹ năng, portfolio và quỹ thời gian của bạn. Khi bạn mở hồ sơ một startup, hệ thống tự đối chiếu giờ rảnh của bạn với ma trận kỳ vọng.</p></aside></section>`}
const chat=()=>st.ch.map(m=>`<p class="${m[0]==='Bạn'?'me':''}"><b>${m[0]}</b> ${esc(m[1])}</p>`).join('');
function task(){const s=cs();if(!st.t0)st.t0=Date.now();return `${steps(2)}<section class="w two"><div><h2>Thử thách 24h của ${s.n}</h2><p class="lead">${s.k}</p><label for="sub">Bài làm của bạn</label><textarea id="sub" rows="7" placeholder="Dán bài làm hoặc liên kết tới sản phẩm.">${esc(st.sub)}</textarea><div class="row l" style="margin-top:12px"><button class="btn" data-a="submit">Nộp bài</button><span class="mu" id="msg"></span></div><h3>Hỏi đáp ngắn</h3><div class="chat" id="chat">${chat()}</div><div class="row l"><input id="qa" placeholder="Hỏi startup một câu ngắn" aria-label="Câu hỏi"><button class="btn s" data-a="ask">Gửi</button></div></div>
<aside class="card side"><h3>Thời gian còn lại</h3><div class="clock" id="clk">24:00:00</div><p class="warn" id="warn" hidden>Còn dưới 1 giờ. Hãy nộp bài trước khi đồng hồ về 0.</p><p class="mu">Hệ thống sẽ nhắc bạn khi gần hết giờ.</p></aside></section>`}
const rate=i=>`<div class="rt" role="group" aria-label="${C1[i]}">${[1,2,3,4,5].map(n=>`<button data-a="rate" data-i="${i}" data-n="${n}" class="${st.r1[i]>=n?'on':''}" aria-label="${n} sao">★</button>`).join('')}</div>`;
function dec(s,ok){
if(st.dec==='join')return `<h3>Bạn đã vào team ${s.n}</h3><p>Hai bên đã cùng chốt. ${s.n} sẽ nhắn lịch họp đầu tiên cho bạn.</p><div><button class="btn" data-a="home">Khám phá startup khác</button></div>`;
if(st.dec==='out')return `<h3>Rút lui lịch sự</h3><p>Chỉnh lại lời nhắn nếu muốn, rồi gửi cho ${s.n}.</p><textarea id="tpl" rows="3" aria-label="Lời nhắn">Mình thấy phong cách làm việc chưa khớp lắm, cảm ơn bạn đã cho mình thử sức, mong còn dịp hợp tác.</textarea><div class="row l"><button class="btn" data-a="send">Gửi lời nhắn</button><button class="btn o" data-a="back">Quay lại</button></div>`;
if(st.dec==='sent')return `<h3>Đã gửi lời nhắn</h3><p>Cảm ơn bạn đã thử sức. Hồ sơ của bạn vẫn mở để các startup khác tìm thấy.</p><div><button class="btn" data-a="home">Khám phá startup khác</button></div>`;
return `<h3>Quyết định của bạn</h3><p class="mu">${ok?'Hai bên đã chấm xong. Chọn một hướng để tiếp tục.':'Chấm đủ 4 tiêu chí để mở nút quyết định.'}</p><div class="row l"><button class="btn" data-a="join" ${ok?'':'disabled'}>Chốt vào team</button><button class="btn o" data-a="out" ${ok?'':'disabled'}>Rút lui lịch sự</button></div>`}
function review(){const s=cs(),ok=st.r1.every(Boolean);return `${steps(3)}<section class="w two"><div class="card"><h3>Bạn chấm ${s.n}</h3>${C1.map((c,i)=>`<div class="rw"><span>${c}</span>${rate(i)}</div>`).join('')}</div><div class="card"><h3>${s.n} chấm bạn</h3>${C2.map((c,i)=>`<div class="rw"><span>${c}</span><b>${ok?C2v[i]+'/5':'Chờ'}</b></div>`).join('')}<p class="mu">${ok?'Startup đã chấm xong.':'Điểm của startup hiện ra sau khi bạn chấm đủ 4 tiêu chí.'}</p></div></section><section class="w"><div class="card dec">${dec(s,ok)}</div></section>`}
function qr(s){let h=0,r='';for(const c of s.id)h=(h*31+c.charCodeAt(0))>>>0;
for(let y=0;y<21;y++)for(let x=0;x<21;x++){let on;
if((x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13)){const px=x>13?x-14:x,py=y>13?y-14:y;on=px===0||px===6||py===0||py===6||(px>1&&px<5&&py>1&&py<5)}
else{h=(Math.imul(h,1103515245)+12345)>>>0;on=(h>>>16)&1}
if(on)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
return `<svg class="qr" viewBox="0 0 21 21" role="img" aria-label="Mã QR minh họa">${r}</svg>`}
const post=s=>`<div class="cov" style="--c:${CL[S.indexOf(s)]}"><small>Startup của tuần</small><span>${s.n}</span></div><div class="pb"><div class="row">${bd(s)}<span class="mu">${s.t}</span></div><ul><li><b>Làm gì</b> ${s.d.split('.')[0]}</li><li><b>Cần ai</b> ${s.r.join(', ')}</li><li><b>Thời gian</b> ${s.h[0]}–${s.h[1]} giờ/tuần, có thử thách 24h</li></ul><div class="row l">${qr(s)}<div><b>Quét để xem hồ sơ</b><br><span class="mu">batay.vn/${s.id}</span></div></div></div>`;
function week(){const s=cs();return `<section class="w two"><div><h2>Startup của tuần</h2><p class="lead">Mẫu bài đăng cho mạng xã hội: người xem biết startup làm gì, cần ai và muốn bấm vào website.</p><label for="ws">Chọn startup để đăng</label><select id="ws">${S.map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${x.n}</option>`).join('')}</select><p class="mu">Bài đăng gồm ảnh bìa, 3 dòng thông tin chính, huy hiệu trạng thái và mã QR dẫn về website.</p></div><div class="post" id="post">${post(s)}</div></section>`}
function how(){return `<section class="w"><h2>Hành trình 60 giây của Hà và Nam</h2><p class="lead">Storyboard video giới thiệu: từ bài đăng trên mạng xã hội đến quyết định chốt hoặc rút lui.</p><div class="g3">${SB.map(c=>`<article class="card"><h3>${c[0]}</h3><dl><dt>Bối cảnh</dt><dd>${c[1]}</dd><dt>Hoạt động</dt><dd>${c[2]}</dd><dt>Hộp thoại</dt><dd>${c[3]}</dd><dt>Hình cần vẽ</dt><dd>${c[4]}</dd></dl></article>`).join('')}</div></section>`}
function clk(){const e=$('#clk');if(!e)return;const l=Math.max(0,864e5-(Date.now()-st.t0));e.textContent=pad(Math.floor(l/36e5))+':'+pad(Math.floor(l%36e5/6e4))+':'+pad(Math.floor(l%6e4/1e3));const w=$('#warn');if(w)w.hidden=l>36e5}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2800)}
const V={home,startup,profile,task,review,week,how};
const draw=()=>{E.innerHTML=(V[cur]||home)();clk()};
function route(){draw();const n=['startup','task','review'].includes(cur)?'home':cur;document.querySelectorAll('nav a').forEach(a=>a.setAttribute('aria-current',a.dataset.v===n?'page':'false'));scrollTo(0,0)}
function go(v){cur=v;location.hash=v;route()}
function act(a,b){
if(a==='open'){st.id=b.dataset.id;go('startup')}
else if(a==='jump')$('#ls').scrollIntoView({behavior:'smooth'});
else if(a==='home')go('home');
else if(a==='start'){st.t0=Date.now();st.sub='';st.r1=[0,0,0,0];st.dec=null;go('task')}
else if(a==='addsk'){const i=$('#ns'),v=i.value.trim();if(v&&!st.sk.includes(v)){st.sk.push(v);$('#sk').innerHTML=skl()}i.value=''}
else if(a==='rmsk'){st.sk.splice(+b.dataset.i,1);$('#sk').innerHTML=skl()}
else if(a==='save')toast('Đã lưu hồ sơ. Giờ rảnh của bạn sẽ được đối chiếu khi xem từng startup.');
else if(a==='ask'){const i=$('#qa'),v=i.value.trim();if(!v)return;st.ch.push(['Bạn',v]);i.value='';$('#chat').innerHTML=chat();setTimeout(()=>{st.ch.push(['Startup','Đã nhận câu hỏi. Chúng mình sẽ trả lời trong vài giờ, bạn cứ làm tiếp nhé.']);const c=$('#chat');if(c)c.innerHTML=chat()},900)}
else if(a==='submit'){const v=$('#sub').value.trim();if(v.length<10){$('#msg').textContent='Hãy nhập bài làm trước khi nộp.';return}st.sub=v;go('review')}
else if(a==='rate'){st.r1[+b.dataset.i]=+b.dataset.n;draw()}
else if(a==='join'){st.dec='join';draw()}
else if(a==='out'){st.dec='out';draw()}
else if(a==='back'){st.dec=null;draw()}
else if(a==='send'){st.dec='sent';draw()}}
E.onclick=e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b)};
E.onkeydown=e=>{if(e.key!=='Enter')return;if(e.target.id==='ns')act('addsk');if(e.target.id==='qa')act('ask')};
E.oninput=e=>{const t=e.target;if(t.id==='q'){st.q=t.value;$('#list').innerHTML=lst()}else if(t.id==='hrs'){st.hrs=+t.value;$('#hv').textContent=t.value}else if(t.id==='sub')st.sub=t.value};
E.onchange=e=>{const t=e.target;if(t.id==='fl'){st.loc=t.value;$('#list').innerHTML=lst()}else if(t.id==='ft'){st.tm=t.value;$('#list').innerHTML=lst()}else if(t.id==='ws'){st.id=t.value;$('#post').innerHTML=post(cs())}};
addEventListener('hashchange',()=>{const v=location.hash.slice(1)||'home';if(v!==cur){cur=v;route()}});
setInterval(clk,1000);
route();
</script>
</body>
</html>
